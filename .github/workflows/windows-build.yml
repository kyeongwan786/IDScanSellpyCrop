name: Build Windows x64 app

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up 64-bit Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          winget install --id UB-Mannheim.TesseractOCR --exact --silent --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw "Tesseract installation failed (exit $LASTEXITCODE)." }
          $tesseractDir = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          if (-not (Test-Path (Join-Path $tesseractDir 'tesseract.exe'))) {
            throw "Tesseract was not found at $tesseractDir."
          }

      - name: Build and verify EXE
        shell: pwsh
        run: |
          $pythonPath = (& python -c "import sys; print(sys.executable)").Trim()
          if (-not $pythonPath -or -not (Test-Path -LiteralPath $pythonPath)) {
            throw "Could not determine the Python executable path."
          }
          $architecture = & $pythonPath -c "import platform; print(platform.machine())"
          Write-Host "Using Python: $pythonPath ($architecture)"
          if ($architecture -ne 'AMD64') { throw "Expected AMD64 Python, got $architecture." }
          $env:IDCARD_PYTHON_X64 = $pythonPath
          $env:TESSERACT_DIR = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          $env:IDCARD_BUILD_DIST = Join-Path $env:GITHUB_WORKSPACE 'dist'
          Set-Location -LiteralPath $env:GITHUB_WORKSPACE
          $batchPath = Join-Path $env:GITHUB_WORKSPACE 'build_windows.bat'
          & cmd.exe /d /c $batchPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Confirm EXE is present for upload
        shell: pwsh
        run: |
          $exePath = Join-Path $env:GITHUB_WORKSPACE 'dist\IDCardCropper.exe'
          $diagnosticPath = Join-Path $env:RUNNER_TEMP 'idcard-build-path.txt'
          $buildPaths = if (Test-Path -LiteralPath $diagnosticPath) { (Get-Content -LiteralPath $diagnosticPath -Raw).Replace("`r", ' ').Replace("`n", '; ') } else { '<no batch path report>' }
          $found = @(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter 'IDCardCropper.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 3 | ForEach-Object { $_.FullName }) -join '; '
          Write-Output "::notice title=EXE path diagnostic::workspace=$env:GITHUB_WORKSPACE; expected=$exePath; batch=$buildPaths; found=$found"
          if (-not (Test-Path -LiteralPath $exePath)) {
            Write-Output "::error title=EXE path check::Expected $exePath; batch=$buildPaths; found: $found"
            throw "Build succeeded but the EXE is missing at $exePath."
          }
          Get-Item -LiteralPath $exePath | Select-Object FullName, Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: IDCardCropper-windows-x64
          path: ${{ github.workspace }}/dist/IDCardCropper.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: ${{ github.workspace }}/dist/IDCardCropper.exe
