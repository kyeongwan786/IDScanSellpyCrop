name: Build Windows x64 app

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up 64-bit Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          winget install --id UB-Mannheim.TesseractOCR --exact --silent --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw "Tesseract installation failed (exit $LASTEXITCODE)." }
          $tesseractDir = Join-Path $env:ProgramFiles 'Tesseract-OCR'
          if (-not (Test-Path (Join-Path $tesseractDir 'tesseract.exe'))) {
            throw "Tesseract was not found at $tesseractDir."
          }
          "TESSERACT_DIR=$tesseractDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify Python architecture
        shell: pwsh
        run: |
          $pythonPath = (Get-Command python).Source
          $architecture = python -c "import platform; print(platform.machine())"
          Write-Host "Python: $pythonPath ($architecture)"
          if ($architecture -ne 'AMD64') { throw "Expected AMD64 Python, got $architecture." }
          "IDCARD_PYTHON_X64=$pythonPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and verify EXE
        shell: cmd
        run: build_windows.bat

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: IDCardCropper-windows-x64
          path: dist/IDCardCropper.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/IDCardCropper.exe
